# ──────────────────────────────────────────────────────────────────────────────
# nginx/nginx.conf
#
# Nginx acts as a reverse proxy and load balancer in front of the two API
# containers. All traffic enters on port 80; Nginx distributes it evenly
# between api_1 and api_2 using round-robin (the default).
#
# When `docker compose up --scale api=2` is used, Docker Compose creates
# two containers whose names follow the pattern <project>-api-1 and
# <project>-api-2. Docker's internal DNS resolves the service name "api"
# to all running replicas automatically — Nginx just upstream to "api".
# ──────────────────────────────────────────────────────────────────────────────

# ── Worker processes ──────────────────────────────────────────────────────────
# "auto" = one worker per CPU core. For our 2-vCPU Vagrant box this means 2.
worker_processes auto;

events {
    # Max simultaneous connections per worker.
    # 1024 is safe for a single-VM setup; raise to 4096+ in real production.
    worker_connections 1024;
}

http {

    # ── MIME types ─────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/json;   # our API always returns JSON

    # ── Logging ────────────────────────────────────────────────────────────────
    # JSON-formatted access log so it integrates easily with log aggregators
    # (Datadog, CloudWatch, ELK stack, etc.)
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log  warn;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip off;   # API returns JSON, not static assets — gzip adds CPU for no gain

    # ── Security headers ───────────────────────────────────────────────────────
    # Remove the Server header so we don't advertise the Nginx version
    server_tokens off;

    # ── Upstream: the two API replicas ─────────────────────────────────────────
    # Nginx resolves "api" via Docker's internal DNS, which returns the IPs
    # of all running api containers. Round-robin is the default algorithm.
    #
    # least_conn; is a good alternative for long-running requests —
    # it routes new connections to the container with the fewest active ones.
    upstream api_backend {
        least_conn;                    # smarter than round-robin for APIs

        server api:8000;               # Docker DNS expands this to all replicas

        # Health check: if a replica fails, stop sending it traffic for 30s
        # (passive health check — no extra module needed)
        keepalive 32;                  # keep persistent connections to upstream
    }

    # ── Server block ───────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;   # catch-all — accepts any hostname

        # ── Timeouts ───────────────────────────────────────────────────────────
        client_max_body_size     1m;
        client_body_timeout      12s;
        client_header_timeout    12s;
        send_timeout             10s;
        proxy_connect_timeout    10s;
        proxy_send_timeout       30s;
        proxy_read_timeout       30s;

        # ── Security headers ───────────────────────────────────────────────────
        add_header X-Content-Type-Options  "nosniff"        always;
        add_header X-Frame-Options         "DENY"           always;
        add_header X-XSS-Protection        "1; mode=block"  always;
        add_header Referrer-Policy         "no-referrer"    always;

        # ── Healthcheck (Nginx-level, no upstream needed) ──────────────────────
        # Returns 200 immediately — useful for load balancer health probes
        location = /nginx-health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        # ── All other traffic → API backend ────────────────────────────────────
        location / {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;

            # Required for keepalive connections to upstream
            proxy_set_header   Connection        "";

            # Pass real client information to the Flask app
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Surface upstream errors clearly
            proxy_intercept_errors off;
        }
    }
}